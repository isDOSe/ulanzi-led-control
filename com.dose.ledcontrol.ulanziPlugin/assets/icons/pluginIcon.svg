<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191922"/>
      <stop offset="1" stop-color="#0A0A0E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#2B2B36" stroke-width="2"/>
  <g filter="url(#glow)">
    <rect x="30" y="40" width="18" height="48" rx="9" fill="#FF3B30"/>
    <rect x="55" y="30" width="18" height="58" rx="9" fill="#FFB020"/>
    <rect x="80" y="46" width="18" height="42" rx="9" fill="#00C7BE"/>
  </g>
  <g>
    <rect x="30" y="40" width="18" height="48" rx="9" fill="url(#bar)"/>
    <rect x="55" y="30" width="18" height="58" rx="9" fill="url(#bar)"/>
    <rect x="80" y="46" width="18" height="42" rx="9" fill="url(#bar)"/>
  </g>
</svg>
