name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip bleak

      - name: Install plugin dependencies
        run: npm run setup

      - name: Validate package
        run: npm run validate

      - name: JavaScript tests
        run: npm test

      - name: Python protocol tests
        run: npm run test:py

      - name: Build store package
        run: npm run package

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: ulanzi-plugin-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
